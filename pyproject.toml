[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortify"
version = "0.1.0"
description = "Sort songs from input playlists into their home playlists on Spotify"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sortify = "sortify.app:main"
spx = "sortify.cli:main"

[tool.setuptools.packages.find]
include = ["sortify*"]

[tool.setuptools.package-data]
sortify = ["static/*"]
