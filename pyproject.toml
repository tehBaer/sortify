[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortify"
version = "0.1.0"
description = "Sort songs from input playlists into their home playlists on Spotify"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # Decompresses the desktop client's LevelDB rootlist (folder refresh).
    "python-snappy>=0.7",
]

[project.optional-dependencies]
# pytest-timeout is test infrastructure, not a runtime dependency — the
# runtime dependency list above stays as it is. Two known regressions in this
# code HANG the suite instead of failing it (an unbounded retry in `decide`'s
# settle logic; `_split_lock` held across a network call, which deadlocks).
# Untimed, both look like a stalled run: nothing is reported, and the failure
# is invisible rather than red.
#
# pillow/pytesseract are also here (not just in clientui below): tests
# import them at module scope, so a plain `pip install -e '.[dev]'` needs
# them present just to COLLECT the suite, even though the OCR tests that
# use them are excluded by default (see the clientui marker below). The
# tesseract BINARY is still a separate system dependency, not installable
# via pip — tests that call it are skipped when it's missing (see
# tests/test_clientui.py).
dev = ["pytest>=8", "pytest-timeout>=2.4", "pytesseract>=0.3.10", "pillow>=10"]
# Drives the desktop client's UI (spfolders); OCR locates menu items on a
# virtual display. Not needed to run the server.
clientui = ["pytesseract>=0.3.10", "pillow>=10"]

[tool.pytest.ini_options]
# Per test, not per run. Generous on purpose: the slowest real test here is a
# two-thread finish/start race that waits on events with its own 10s bounds,
# and the whole suite runs in ~3s — so 60s cannot be reached by anything
# except genuinely stuck code, and a hang becomes an ordinary red test.
timeout = 60
# "thread", not the default "signal": both hangs this exists for park a
# request thread (a deadlocked lock, a runaway retry) while the main thread
# waits on it, and unwinding that through a signal took over four minutes in
# one measured case and never finished in another. The thread method dumps
# every thread's stack and ends the run at the deadline, which is the whole
# point — a hang should read as a failure with a traceback, not as a run
# that is still going.
timeout_method = "thread"
# The clientui marker gates tests that drive the real desktop client
# (minutes of Xvfb + OCR, and they create/delete scratch objects on the
# account). Deselected by default so `pytest -q` stays a zero-API,
# zero-client run; opt in with `pytest -m clientui`.
markers = ["clientui: drives the real desktop client (excluded by default)"]
addopts = "-m 'not clientui'"

[project.scripts]
sortify = "sortify.app:main"
spx = "sortify.cli:main"
spfolders = "sortify.foldermove:main"

[tool.setuptools.packages.find]
include = ["sortify*"]

[tool.setuptools.package-data]
sortify = ["static/*"]
